services:
  home_assistant:
    container_name: home_assistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    # HA needs more than the default 10s to shut down cleanly (recorder flush,
    # integrations unloading); without this it gets SIGKILLed mid-shutdown.
    stop_grace_period: 60s
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./appdata/home-assistant:/config

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    ports:
      - "1883:1883"
    volumes:
      - ./appdata/mosquitto/config:/mosquitto/config
      - ./appdata/mosquitto/data:/mosquitto/data
      - ./appdata/mosquitto/log:/mosquitto/log
      - ./appdata/mosquitto/pwfile:/mosquitto/pwfile

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    environment:
      - TZ=${TZ}
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=${ZIGBEE2MQTT_CONFIG_MQTT_SERVER}
      - ZIGBEE2MQTT_CONFIG_MQTT_USER=${ZIGBEE2MQTT_CONFIG_MQTT_USER}
      - ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD=${ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD}
      - ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED=true
      - ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED=true
      - ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_SYMLINK_CURRENT=true
      # Pinned Zigbee network identity. Without these Zigbee2MQTT falls back to its
      # defaults and can form a *new* network instead of resuming the existing one.
      # In particular ext_pan_id defaults to [221 x 8]; on the ember adapter that is
      # used literally and would orphan every paired device.
      # Kept in .env: ext_pan_id is the coordinator IEEE and the network key is secret.
      # Decimal only - Zigbee2MQTT JSON-parses these env vars, so 0x.. literals are rejected.
      - ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL=${ZIGBEE_CHANNEL}
      - ZIGBEE2MQTT_CONFIG_ADVANCED_PAN_ID=${ZIGBEE_PAN_ID}
      - ZIGBEE2MQTT_CONFIG_ADVANCED_EXT_PAN_ID=${ZIGBEE_EXT_PAN_ID}
      - ZIGBEE2MQTT_CONFIG_ADVANCED_NETWORK_KEY=${ZIGBEE_NETWORK_KEY}
      - ZIGBEE2MQTT_CONFIG_SERIAL_PORT=${ZIGBEE_COORDINATOR}
      - ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER=ember
    ports:
      - "8080:8080"
    volumes:
      - ./appdata/zigbee2mqtt/data:/app/data
    restart: unless-stopped
    depends_on:
      - mosquitto
