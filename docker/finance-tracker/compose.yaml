services:
  finance-tracker:
    # Built and pushed by CI, never built here. FINANCE_TRACKER_TAG overrides the tag
    # to roll back to an earlier build; leaving it unset follows the newest one.
    image: ${REGISTRY}/harold/finance-tracker:${FINANCE_TRACKER_TAG:-latest}
    container_name: finance-tracker
    restart: unless-stopped
    # Node as PID 1 ignores SIGTERM, so without an init every stop waits out the
    # 10 s timeout.
    init: true
    environment:
      PASSWORD_HASH: ${PASSWORD_HASH:?set in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      API_TOKEN_HASH: ${API_TOKEN_HASH:?set in .env}
    ports:
      - "8081:3000"
    volumes:
      - ./appdata:/app/appdata
